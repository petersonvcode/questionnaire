<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/index.css" />
    <title>Questionnaire</title>
    <script type="module" src="/index.ts"></script>
</head>

<body>
    <h1 id="title">Questões</h1>

    <div id="main-page">
        <button id="test-btn">Provas</button>
        <button id="themes-btn">Temas</button>
        <button id="random-question-btn">Aleatório</button>
    </div>

    <div id="test-page">
        TBD
        <div class="buttons-container">
            <button class="go-to-main-btn">Voltar</button>
        </div>
    </div>

    <div id="themes-question-page">
        <h3>Selecione os temas</h3>
        <div id="themes-container">
            <div id="themes-list">Carregando...</div>
            <span id="q-available">Disponíveis: 0 </span>
            <br />
            <span>Quantidade de questões:</span>
            <div id="q-count">
                <button disabled class="q-count-btn">1</button>
                <button disabled class="q-count-btn">5</button>
                <button disabled class="q-count-btn">10</button>
                <button disabled class="q-count-btn">25</button>
                <button disabled class="q-count-btn">50</button>
            </div>
            <div class="buttons-container">
                <button class="go-to-main-btn">Voltar</button>
                <button id="confirm-tags-btn">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="random-question-page">
        <div id="question-text">Carregando...</div>
        <div class="options-container"></div>
        <div class="buttons-container">
            <button class="go-to-main-btn">Voltar</button>
            <button id="confirm-rnd-question-btn" disabled>Confirmar</button>
            <button id="another-rnd-question-btn">Próxima</button>
        </div>
    </div>

    <div id="questions-answering-page">
        <div class="question-navigation">Carregando...</div>
        <div id="question-container">
            <div id="a-question-text">Carregando...</div>
            <div class="options-container">Carregando...</div>
        </div>
        <div class="buttons-container">
            <button id="next-question-btn">Próxima</button>
            <button id="confirm-answering-btn" disabled>Confirmar</button>
            <button id="change-answer-btn">Alterar</button>
            <button id="finish-answering-btn">Finalizar</button>
        </div>
    </div>

    <div id="results-page">
        <div class="question-navigation"></div>
        <div id="r-question-text"></div>
        <div class="options-container"></div>
        <div id="r-summary">resultados</div>
        <div class="buttons-container">
            <button class="go-to-main-btn">Voltar</button>
            <button id="r-next-btn">Próxima</button>
        </div>
    </div>
</body>

</html>
